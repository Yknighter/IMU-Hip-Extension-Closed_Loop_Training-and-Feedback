<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 900 1130" role="img" aria-labelledby="title desc"><title id="title">One reward per extension</title><desc id="desc">RETURN TO NEUTRAL: E ≤ 0 for 200 ms. READY: Wait until E &gt; 0. BEGIN EXTENSION: Lock the target for this cycle. CONFIRM TARGET: E ≥ locked target for 30 ms. REWARD ONCE: Request a 0.2 s pulse at strength 2. HOLD THE CYCLE LOCK: No repeat reward while holding extension</desc><rect width="900" height="1130" fill="#ffffff"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="60" y="58" font-size="32" font-weight="700" fill="#13243b">One reward per extension</text><text x="60" y="96" font-size="20" font-weight="400" fill="#53657b">Normal cycle · E = filtered positive extension</text><rect x="60" y="133" width="780" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="101" cy="184" r="23" fill="#2563eb"/><text x="93" y="192" font-size="23" font-weight="700" fill="#ffffff">1</text><text x="145" y="172" font-size="23" font-weight="700" fill="#172b4d">RETURN TO NEUTRAL</text><text x="145" y="210" font-size="22" font-weight="400" fill="#172b4d">E ≤ 0 for 200 ms</text><path d="M450 241 V261" stroke="#64748b" stroke-width="2"/><path d="M444 256 L450 264 L456 256" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="272" width="780" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="101" cy="323" r="23" fill="#2563eb"/><text x="93" y="331" font-size="23" font-weight="700" fill="#ffffff">2</text><text x="145" y="311" font-size="23" font-weight="700" fill="#172b4d">READY</text><text x="145" y="349" font-size="22" font-weight="400" fill="#172b4d">Wait until E &gt; 0</text><path d="M450 380 V400" stroke="#64748b" stroke-width="2"/><path d="M444 395 L450 403 L456 395" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="411" width="780" height="104" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><circle cx="101" cy="462" r="23" fill="#087f6c"/><text x="93" y="470" font-size="23" font-weight="700" fill="#ffffff">3</text><text x="145" y="450" font-size="23" font-weight="700" fill="#172b4d">BEGIN EXTENSION</text><text x="145" y="488" font-size="22" font-weight="400" fill="#172b4d">Lock the target for this cycle</text><path d="M450 519 V539" stroke="#64748b" stroke-width="2"/><path d="M444 534 L450 542 L456 534" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="550" width="780" height="104" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><circle cx="101" cy="601" r="23" fill="#087f6c"/><text x="93" y="609" font-size="23" font-weight="700" fill="#ffffff">4</text><text x="145" y="589" font-size="23" font-weight="700" fill="#172b4d">CONFIRM TARGET</text><text x="145" y="627" font-size="22" font-weight="400" fill="#172b4d">E ≥ locked target for 30 ms</text><path d="M450 658 V678" stroke="#64748b" stroke-width="2"/><path d="M444 673 L450 681 L456 673" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="689" width="780" height="104" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><circle cx="101" cy="740" r="23" fill="#b96812"/><text x="93" y="748" font-size="23" font-weight="700" fill="#ffffff">5</text><text x="145" y="728" font-size="23" font-weight="700" fill="#172b4d">REWARD ONCE</text><text x="145" y="766" font-size="22" font-weight="400" fill="#172b4d">Request a 0.2 s pulse at strength 2</text><path d="M450 797 V817" stroke="#64748b" stroke-width="2"/><path d="M444 812 L450 820 L456 812" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="828" width="780" height="104" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><circle cx="101" cy="879" r="23" fill="#b96812"/><text x="93" y="887" font-size="23" font-weight="700" fill="#ffffff">6</text><text x="145" y="867" font-size="23" font-weight="700" fill="#172b4d">HOLD THE CYCLE LOCK</text><text x="145" y="905" font-size="22" font-weight="400" fill="#172b4d">No repeat reward while holding extension</text><text x="60" y="1010" font-size="20" font-weight="400" fill="#53657b">Next cycle: return to E ≤ 0 for 200 ms.</text><text x="60" y="1044" font-size="20" font-weight="400" fill="#53657b">Invalid data: cancel the cycle and attempt motor off.</text><text x="60" y="1078" font-size="18" font-weight="400" fill="#53657b">Timing is sample-based. Commands do not confirm motor response.</text></g></svg>
