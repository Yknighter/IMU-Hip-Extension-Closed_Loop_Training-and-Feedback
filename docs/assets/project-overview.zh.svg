<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1510" viewBox="0 0 1000 1510" role="img" aria-labelledby="title"><title id="title">训练闭环如何运行</title><rect width="1000" height="1510" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="56" font-size="34" font-weight="700" fill="#13243b">训练闭环如何运行</text><text x="55" y="96" font-size="22" font-weight="400" fill="#53657b">V19.81 · 姿态测量、自适应目标与奖励指令</text><rect x="55" y="130" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="164" font-size="25" font-weight="700" fill="#172b4d">01  采集与检查</text><text x="80" y="203" font-size="24" font-weight="400" fill="#172b4d">骨盆 + 右大腿 + 左大腿 IMU</text><text x="80" y="235" font-size="22" font-weight="400" fill="#53657b">标称 100 Hz · 检查必需的传感器数值</text><path d="M500 259 V284 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="290" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="324" font-size="25" font-weight="700" fill="#172b4d">02  稳定站立校准</text><text x="80" y="363" font-size="24" font-weight="400" fill="#172b4d">连续保持稳定姿态 2 秒</text><text x="80" y="395" font-size="22" font-weight="400" fill="#53657b">平均四元数 · 航向对齐 · 建立髋角零点</text><path d="M500 419 V444 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="450" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="484" font-size="25" font-weight="700" fill="#172b4d">03  计算后伸指标</text><text x="80" y="523" font-size="24" font-weight="400" fill="#172b4d">相对髋角 → 5 点移动平均</text><text x="80" y="555" font-size="22" font-weight="400" fill="#53657b">选择训练腿 · 转换为正向后伸指标 E</text><path d="M500 579 V604 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="610" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="644" font-size="25" font-weight="700" fill="#172b4d">04  初始能力评估</text><text x="80" y="683" font-size="24" font-weight="400" fill="#172b4d">静默评估 60 秒，收集有效动作峰值</text><text x="80" y="715" font-size="22" font-weight="400" fill="#53657b">取 75% 分位样本 → 向下取整 → 目标为 1° 至 15°</text><path d="M500 739 V762 H270 V790 M500 762 H730 V790" fill="none" stroke="#64748b" stroke-width="2"/><path d="M264 782 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><path d="M724 782 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="797" width="430" height="300" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><text x="77" y="838" font-size="25" font-weight="700" fill="#b96812">即时奖励</text><text x="77" y="885" font-size="21" font-weight="400" fill="#172b4d">E ≤ 0 持续 200 ms 后就绪</text><text x="77" y="925" font-size="21" font-weight="400" fill="#172b4d">动作开始时锁定本次目标</text><text x="77" y="965" font-size="21" font-weight="400" fill="#172b4d">连续达标 30 ms</text><text x="77" y="1005" font-size="21" font-weight="400" fill="#172b4d">一次 0.2 秒震动，强度 2</text><text x="77" y="1045" font-size="21" font-weight="400" fill="#172b4d">持续后伸不重复奖励</text><rect x="515" y="797" width="430" height="300" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><text x="537" y="838" font-size="25" font-weight="700" fill="#087f6c">自适应目标</text><text x="537" y="885" font-size="21" font-weight="400" fill="#172b4d">收集完整动作片段的峰值</text><text x="537" y="925" font-size="21" font-weight="400" fill="#172b4d">每个 60 秒窗口结算</text><text x="537" y="965" font-size="21" font-weight="400" fill="#172b4d">至少 8 次有效动作</text><text x="537" y="1005" font-size="21" font-weight="400" fill="#172b4d">成功率 ≥ 80% → 目标增加 1°</text><text x="537" y="1045" font-size="21" font-weight="400" fill="#172b4d">目标上限：15°</text><path d="M270 1103 V1130 H730 V1103 M500 1130 V1160" fill="none" stroke="#64748b" stroke-width="2"/><path d="M494 1152 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="1167" width="890" height="125" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="80" y="1202" font-size="25" font-weight="700" fill="#172b4d">记录与显示</text><text x="80" y="1240" font-size="22" font-weight="400" fill="#172b4d">Hub 记录角度、目标、动作结果及震动命令事件</text><text x="80" y="1274" font-size="22" font-weight="400" fill="#172b4d">只读 Windows 查看器展示遥测数据和 Hub 状态</text><text x="55" y="1350" font-size="20" font-weight="400" fill="#53657b">输入无效 → 取消奖励，并尝试停止震动。</text><text x="55" y="1390" font-size="20" font-weight="400" fill="#53657b">feedback_min 只接收命令；当前不测量电机实际响应。</text><text x="55" y="1430" font-size="20" font-weight="400" fill="#53657b">时间按标称采样率计算；图中省略默认关闭的手动阈值校准。</text></g></svg>
