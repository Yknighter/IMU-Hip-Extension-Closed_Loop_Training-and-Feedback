<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1510" viewBox="0 0 1000 1510" role="img" aria-labelledby="title"><title id="title">How the training loop works</title><rect width="1000" height="1510" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="56" font-size="34" font-weight="700" fill="#13243b">How the training loop works</text><text x="55" y="96" font-size="22" font-weight="400" fill="#53657b">V19.81 · Measurement, adaptive targets and reward commands</text><rect x="55" y="130" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="164" font-size="25" font-weight="700" fill="#172b4d">01  ACQUIRE &amp; VALIDATE</text><text x="80" y="203" font-size="24" font-weight="400" fill="#172b4d">Pelvis + right thigh + left thigh IMUs</text><text x="80" y="235" font-size="22" font-weight="400" fill="#53657b">Nominal 100 Hz · Check required sensor values</text><path d="M500 259 V284 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="290" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="324" font-size="25" font-weight="700" fill="#172b4d">02  CALIBRATE STANDING POSE</text><text x="80" y="363" font-size="24" font-weight="400" fill="#172b4d">Hold a stable pose for 2 seconds</text><text x="80" y="395" font-size="22" font-weight="400" fill="#53657b">Average quaternions · Align yaw · Set hip zero</text><path d="M500 419 V444 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="450" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="484" font-size="25" font-weight="700" fill="#172b4d">03  COMPUTE EXTENSION</text><text x="80" y="523" font-size="24" font-weight="400" fill="#172b4d">Relative hip angle → 5-sample moving average</text><text x="80" y="555" font-size="22" font-weight="400" fill="#53657b">Select training leg · Convert to positive extension E</text><path d="M500 579 V604 m-6 -8 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="610" width="890" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="644" font-size="25" font-weight="700" fill="#172b4d">04  ASSESS INITIAL ABILITY</text><text x="80" y="683" font-size="24" font-weight="400" fill="#172b4d">Silent 60-second assessment of valid episode peaks</text><text x="80" y="715" font-size="22" font-weight="400" fill="#53657b">75th-percentile sample → floor → target from 1° to 15°</text><path d="M500 739 V762 H270 V790 M500 762 H730 V790" fill="none" stroke="#64748b" stroke-width="2"/><path d="M264 782 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><path d="M724 782 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="797" width="430" height="300" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><text x="77" y="838" font-size="25" font-weight="700" fill="#b96812">IMMEDIATE REWARD</text><text x="77" y="885" font-size="21" font-weight="400" fill="#172b4d">Rearm: E ≤ 0 for 200 ms</text><text x="77" y="925" font-size="21" font-weight="400" fill="#172b4d">Lock target at cycle start</text><text x="77" y="965" font-size="21" font-weight="400" fill="#172b4d">Confirm target for 30 ms</text><text x="77" y="1005" font-size="21" font-weight="400" fill="#172b4d">One 0.2 s pulse, strength 2</text><text x="77" y="1045" font-size="21" font-weight="400" fill="#172b4d">No repeat while holding</text><rect x="515" y="797" width="430" height="300" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><text x="537" y="838" font-size="25" font-weight="700" fill="#087f6c">ADAPTIVE TARGET</text><text x="537" y="885" font-size="21" font-weight="400" fill="#172b4d">Collect completed episode peaks</text><text x="537" y="925" font-size="21" font-weight="400" fill="#172b4d">Evaluate each 60-second window</text><text x="537" y="965" font-size="21" font-weight="400" fill="#172b4d">At least 8 valid episodes</text><text x="537" y="1005" font-size="21" font-weight="400" fill="#172b4d">At least 80% success → +1°</text><text x="537" y="1045" font-size="21" font-weight="400" fill="#172b4d">Target limit: 15°</text><path d="M270 1103 V1130 H730 V1103 M500 1130 V1160" fill="none" stroke="#64748b" stroke-width="2"/><path d="M494 1152 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="55" y="1167" width="890" height="125" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="80" y="1202" font-size="25" font-weight="700" fill="#172b4d">RECORD &amp; DISPLAY</text><text x="80" y="1240" font-size="22" font-weight="400" fill="#172b4d">Hub records angles, targets, outcomes and command events</text><text x="80" y="1274" font-size="22" font-weight="400" fill="#172b4d">Read-only Windows viewer displays telemetry and Hub status</text><text x="55" y="1350" font-size="20" font-weight="400" fill="#53657b">Invalid input → cancel reward and attempt motor off.</text><text x="55" y="1390" font-size="20" font-weight="400" fill="#53657b">feedback_min receives commands; motor response is not measured.</text><text x="55" y="1430" font-size="20" font-weight="400" fill="#53657b">Times are nominal sample-based values. Optional manual calibration is omitted.</text></g></svg>
