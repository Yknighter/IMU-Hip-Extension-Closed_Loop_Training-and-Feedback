<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 900 1130" role="img" aria-labelledby="title desc"><title id="title">每次后伸，只奖励一次</title><desc id="desc">回到中立位: E ≤ 0，连续保持 200 ms. 准备下一次动作: 等待 E &gt; 0. 开始后伸: 锁定本次动作使用的目标角度. 确认达标: E ≥ 锁定目标，连续保持 30 ms. 奖励一次: 请求 0.2 秒短震动，强度为 2. 保持本次动作锁定: 持续后伸不会重复触发奖励</desc><rect width="900" height="1130" fill="#ffffff"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="60" y="58" font-size="32" font-weight="700" fill="#13243b">每次后伸，只奖励一次</text><text x="60" y="96" font-size="20" font-weight="400" fill="#53657b">正常动作流程 · E 为滤波后的正向后伸指标</text><rect x="60" y="133" width="780" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="101" cy="184" r="23" fill="#2563eb"/><text x="93" y="192" font-size="23" font-weight="700" fill="#ffffff">1</text><text x="145" y="172" font-size="23" font-weight="700" fill="#172b4d">回到中立位</text><text x="145" y="210" font-size="22" font-weight="400" fill="#172b4d">E ≤ 0，连续保持 200 ms</text><path d="M450 241 V261" stroke="#64748b" stroke-width="2"/><path d="M444 256 L450 264 L456 256" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="272" width="780" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="101" cy="323" r="23" fill="#2563eb"/><text x="93" y="331" font-size="23" font-weight="700" fill="#ffffff">2</text><text x="145" y="311" font-size="23" font-weight="700" fill="#172b4d">准备下一次动作</text><text x="145" y="349" font-size="22" font-weight="400" fill="#172b4d">等待 E &gt; 0</text><path d="M450 380 V400" stroke="#64748b" stroke-width="2"/><path d="M444 395 L450 403 L456 395" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="411" width="780" height="104" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><circle cx="101" cy="462" r="23" fill="#087f6c"/><text x="93" y="470" font-size="23" font-weight="700" fill="#ffffff">3</text><text x="145" y="450" font-size="23" font-weight="700" fill="#172b4d">开始后伸</text><text x="145" y="488" font-size="22" font-weight="400" fill="#172b4d">锁定本次动作使用的目标角度</text><path d="M450 519 V539" stroke="#64748b" stroke-width="2"/><path d="M444 534 L450 542 L456 534" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="550" width="780" height="104" rx="12" fill="#edf9f4" stroke="#087f6c" stroke-width="1.5"/><circle cx="101" cy="601" r="23" fill="#087f6c"/><text x="93" y="609" font-size="23" font-weight="700" fill="#ffffff">4</text><text x="145" y="589" font-size="23" font-weight="700" fill="#172b4d">确认达标</text><text x="145" y="627" font-size="22" font-weight="400" fill="#172b4d">E ≥ 锁定目标，连续保持 30 ms</text><path d="M450 658 V678" stroke="#64748b" stroke-width="2"/><path d="M444 673 L450 681 L456 673" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="689" width="780" height="104" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><circle cx="101" cy="740" r="23" fill="#b96812"/><text x="93" y="748" font-size="23" font-weight="700" fill="#ffffff">5</text><text x="145" y="728" font-size="23" font-weight="700" fill="#172b4d">奖励一次</text><text x="145" y="766" font-size="22" font-weight="400" fill="#172b4d">请求 0.2 秒短震动，强度为 2</text><path d="M450 797 V817" stroke="#64748b" stroke-width="2"/><path d="M444 812 L450 820 L456 812" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="828" width="780" height="104" rx="12" fill="#fff7ec" stroke="#b96812" stroke-width="1.5"/><circle cx="101" cy="879" r="23" fill="#b96812"/><text x="93" y="887" font-size="23" font-weight="700" fill="#ffffff">6</text><text x="145" y="867" font-size="23" font-weight="700" fill="#172b4d">保持本次动作锁定</text><text x="145" y="905" font-size="22" font-weight="400" fill="#172b4d">持续后伸不会重复触发奖励</text><text x="60" y="1010" font-size="20" font-weight="400" fill="#53657b">下一次动作：E 回到 ≤ 0 并持续 200 ms。</text><text x="60" y="1044" font-size="20" font-weight="400" fill="#53657b">数据无效：取消当前动作，并尝试停止震动。</text><text x="60" y="1078" font-size="18" font-weight="400" fill="#53657b">时间按样本计数；发出命令不代表已确认电机响应。</text></g></svg>
